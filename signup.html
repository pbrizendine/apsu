<!doctype html>
<html lang="en">
  <head>
    <script src="js/privacy.js"></script
    ><script src="js/theme.js"></script>
    <script src="js/ui.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | APSU</title>
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/playtest.css" /><link rel="stylesheet" href="css/site.css" />
  </head>
  <body class="app-page auth-page">
    <header
      ><p><a class="apsu-home" href="index.html">APSU</a></p></header
    >
    <main>
      <h1>Sign Up</h1>
      <form id="auth-form" aria-describedby="auth-status">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />

        <label for="birth-date">Date of birth</label>
        <input
          id="birth-date"
          name="birth-date"
          type="date"
          autocomplete="bday"
          min="1900-01-01"
          required
          aria-describedby="age-explanation"
        />
        <p id="age-explanation"
          >You must be 13 or older. Your date of birth stays private and controls access to 18+
          worlds. It is not shown on your profile.</p
        >
        <label class="consent-label"
          ><input id="terms-consent" type="checkbox" required /><span
            >I agree to the
            <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and have read
            the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>. If I am
            under 18, I have permission from a parent or guardian.</span
          ></label
        >
        <p class="policy-draft"
          >The policy drafts need operator contact details before this version is released.</p
        >
        <button id="submit-button" type="submit">Create Account</button>
      </form>
      <p id="auth-status" role="status" aria-live="polite"></p>
      <nav class="auth-links" aria-label="Account navigation"
        ><a class="button-link" href="login.html">Log in</a
        ><a class="button-link" href="index.html">Return Home</a></nav
      >
    </main>

    <script src="js/supabase-vendor.js"></script>
    <script src="js/apsu-config.js"></script>
    <script src="js/supabase-client.js"></script
    ><script src="js/account-eligibility.js"></script
    ><script src="js/direct-messages.js"></script>
    <script src="js/signup-page.js"></script>
  </body>
</html>
