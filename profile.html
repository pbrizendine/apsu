<!doctype html>
<html lang="en">
  <head>
    <script src="js/privacy.js"></script
    ><script src="js/theme.js"></script>
    <script src="js/ui.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | APSU</title>
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/profile-page.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/playtest.css" /><link rel="stylesheet" href="css/site.css" />
  </head>
  <body class="app-page profile-page">
    <header
      ><p><a class="apsu-home" href="index.html">APSU</a></p></header
    >
    <main>
      <h1>User Profile</h1>
      <p id="profile-status" role="status">Loading profile…</p>
      <section id="profile-content" aria-labelledby="profile-name" hidden>
        <h2 id="profile-name"></h2><div id="player-picture"></div>
        <dl>
          <dt>Member since</dt><dd id="profile-joined"></dd> <dt>About Me</dt
          ><dd id="profile-about">No bio added yet.</dd>
        </dl>
        <button type="button" id="edit-about" hidden>Edit About Me</button>
        <form id="about-form" hidden aria-describedby="about-status">
          <label for="about-input">About Me</label>
          <textarea
            id="about-input"
            maxlength="2000"
            rows="6"
            aria-describedby="about-help"
          ></textarea>
          <p id="about-help">Up to 2,000 characters.</p>
          <button type="submit" id="save-about">Save</button>
          <button type="button" id="cancel-about">Cancel</button>
        </form>
        <p id="about-status" role="status"></p>
      </section>
      <p><a class="button-link" href="launchpad.html">Return to Home Page</a></p>
    </main>
    <script src="js/supabase-vendor.js"></script>
    <script src="js/image-crop.js"></script>
    <script src="js/apsu-config.js"></script>
    <script src="js/supabase-client.js"></script
    ><script src="js/account-eligibility.js"></script
    ><script src="js/direct-messages.js"></script
    ><script src="js/player-picture.js"></script>
    <script src="js/profile-page.js"></script>
  </body>
</html>
