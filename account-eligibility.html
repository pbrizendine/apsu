    ><main
      ><h1>Before you enter a world</h1
      ><p
        >Confirm your age and review the terms. Your date of birth stays private. APSU requires age
        13 or older; 18+ worlds remain unavailable until you turn 18.</p
      ><form id="eligibility-form" novalidate
        ><label for="birth-date">Date of birth</label
        ><input id="birth-date" type="date" min="1900-01-01" autocomplete="bday" required /><label
          class="consent-label"
          ><input type="checkbox" id="terms-consent" required /><span
            >I agree to the
            <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and have read
            the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>. If I am
            under 18, I have permission from a parent or guardian.</span
          ></label
        ><button type="submit">Continue to launchpad</button></form
      ><p id="eligibility-status" role="status"></p
      ><p
        >Need to correct a saved date?
        <a href="privacy-requests.html">Submit a privacy request.</a></p
      ></main
