<!doctype html>
<html lang="en"
  ><head
    ><meta charset="UTF-8" /><meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    /><title>Choose a new password | APSU</title
    ><script src="js/privacy.js"></script
    ><script src="js/theme.js"></script
    ><script src="js/ui.js" defer></script
    ><link rel="stylesheet" href="css/auth.css" /><link
      rel="stylesheet"
      href="css/theme.css"
    /><link rel="stylesheet" href="css/playtest.css" /><link
      rel="stylesheet"
      href="css/site.css"
    /> </head
  ><body class="app-page auth-page"
    ><header
      ><p><a class="apsu-home" href="index.html">APSU</a></p></header
    ><main
      ><h1>Choose a new password</h1
      ><form id="auth-form" novalidate
        ><label for="password">New password</label
        ><input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        /><label for="confirm-password">Confirm password</label
        ><input
          id="confirm-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        /><button id="submit-button" disabled>Save password</button></form
      ><p id="auth-status" role="status" aria-live="polite"></p
      ><a class="button-link" href="login.html">Return to login</a></main
    ><script src="js/supabase-vendor.js"></script
    ><script src="js/apsu-config.js"></script>
    <script src="js/supabase-client.js"></script
    ><script src="js/account-eligibility.js"></script
    ><script src="js/direct-messages.js"></script
    ><script src="js/reset-password.js"></script></body
></html>
