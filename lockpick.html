<!doctype html>
<html lang="en">
  <head>
    <script src="js/privacy.js"></script
    ><script src="js/theme.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lockpick</title>

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/lockpick-page.css" />
    <link rel="stylesheet" href="css/lockpick-metal.css" />
    <link rel="stylesheet" href="css/playtest.css" /><link rel="stylesheet" href="css/site.css" />
  </head>

  <body class="lockpick-metal">
    <h1>The door is locked</h1>

    <div class="attempt-counter" aria-label="Attempts remaining">
      <span class="attempt-number" aria-live="polite">15</span>
      <div class="attempt-track"><div class="attempt-fill"></div></div>
    </div>

    <div class="lock">
      <!-- Each circle draws a 116-degree section with a 4-degree gap. -->
      <svg
        class="progress-ring"
        viewBox="0 0 300 300"
        role="progressbar"
        aria-label="Lock progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <circle
          cx="150"
          cy="150"
          r="145"
          pathLength="360"
          stroke-dasharray="116 244"
          transform="rotate(-88 150 150)"
        />
        <circle
          cx="150"
          cy="150"
          r="145"
          pathLength="360"
          stroke-dasharray="116 244"
          transform="rotate(32 150 150)"
        />
        <circle
          cx="150"
          cy="150"
          r="145"
          pathLength="360"
          stroke-dasharray="116 244"
          transform="rotate(152 150 150)"
        />
        <circle
          class="round-progress"
          cx="150"
          cy="150"
          r="145"
          pathLength="360"
          stroke-dasharray="0 360"
          transform="rotate(-88 150 150)"
        />
        <circle
          class="round-progress"
          cx="150"
          cy="150"
          r="145"
          pathLength="360"
          stroke-dasharray="0 360"
          transform="rotate(32 150 150)"
        />
        <circle
          class="round-progress"
          cx="150"
          cy="150"
          r="145"
          pathLength="360"
          stroke-dasharray="0 360"
          transform="rotate(152 150 150)"
        />
      </svg>
      <div class="keyhole"></div>
      <div class="pick loose" title="Lockpick"></div>
    </div>

    <div class="pick-controls">
      <button class="turn-button-left">Turn Pick Left [Q]</button>
      <button class="try-button">Try Lock [Space]</button>
      <button class="turn-button-right">Turn Pick Right [E]</button>
    </div>

    <p class="result"></p>

    <script src="js/lockpick-page.js"></script>
  </body>
</html>
