<!doctype html>
<html lang="en">
  <head>
    <script src="js/privacy.js"></script
    ><script src="js/theme.js"></script>
    <script src="js/ui.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | APSU</title>
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/playtest.css" /><link rel="stylesheet" href="css/site.css" />
  </head>
  <body class="app-page auth-page">
    <header
      ><p><a class="apsu-home" href="index.html">APSU</a></p></header
    >
    <main>
      <h1>Log In</h1>
      <form id="auth-form" aria-describedby="auth-status">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button id="submit-button" type="submit">Log In</button>
      </form>
      <p id="auth-status" role="status" aria-live="polite"></p>
      <div class="auth-links"
        ><a class="button-link" href="signup.html">Create an account</a>
        <a class="button-link" href="forgot-password.html">Forgot password?</a>
        <a class="button-link" href="index.html">APSU Home</a></div
      >
    </main>

    <script src="js/supabase-vendor.js"></script>
    <script src="js/apsu-config.js"></script>
    <script src="js/supabase-client.js"></script
    ><script src="js/account-eligibility.js"></script
    ><script src="js/direct-messages.js"></script>
    <script src="js/login-page.js"></script>
  </body>
</html>
